name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.0.13)'
        required: true
        default: 'v0.0.13'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            media/package-lock.json
            bulletin/package-lock.json
            foldersize/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            media/src-tauri
            bulletin/src-tauri
            foldersize/src-tauri

      - name: Set version from tag
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          $replace = '"version": "' + $ver + '"'
          (Get-Content media\package.json)             -replace '"version": "[^"]*"', $replace | Set-Content media\package.json
          (Get-Content bulletin\package.json)           -replace '"version": "[^"]*"', $replace | Set-Content bulletin\package.json
          (Get-Content foldersize\package.json)         -replace '"version": "[^"]*"', $replace | Set-Content foldersize\package.json
          (Get-Content media\src-tauri\tauri.conf.json)      -replace '"version": "[^"]*"', $replace | Set-Content media\src-tauri\tauri.conf.json
          (Get-Content bulletin\src-tauri\tauri.conf.json)   -replace '"version": "[^"]*"', $replace | Set-Content bulletin\src-tauri\tauri.conf.json
          (Get-Content foldersize\src-tauri\tauri.conf.json) -replace '"version": "[^"]*"', $replace | Set-Content foldersize\src-tauri\tauri.conf.json

      - name: Install media dependencies
        run: npm ci
        working-directory: media

      - name: Install bulletin dependencies
        run: npm ci
        working-directory: bulletin

      - name: Install foldersize dependencies
        run: npm ci
        working-directory: foldersize

      - name: Build media
        run: npm run build:exe
        working-directory: media

      - name: Build bulletin
        run: npm run build:exe
        working-directory: bulletin

      - name: Build foldersize
        run: npm run build:exe
        working-directory: foldersize

      - name: Create release zips
        run: |
          New-Item -ItemType Directory -Force -Path _bulletin, _media, _foldersize
          Copy-Item release\family_bulletin.exe   _bulletin\family_bulletin.exe
          Copy-Item release\family_media.exe      _media\family_media.exe
          Copy-Item release\family_foldersize.exe _foldersize\family_foldersize.exe
          Compress-Archive -Path _bulletin\*   -DestinationPath family_bulletin.zip   -Force
          Compress-Archive -Path _media\*      -DestinationPath family_media.zip      -Force
          Compress-Archive -Path _foldersize\* -DestinationPath family_foldersize.zip -Force
          Write-Host "=== zip contents ==="
          Get-ChildItem release

      - name: Upload to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            family_bulletin.zip
            family_media.zip
            family_foldersize.zip
          generate_release_notes: true
