[package]
name = "family_foldersize"
version = "0.1.0"
description = "Family folder size analyzer app"
authors = ["you"]
edition = "2021"

[lib]
name = "family_foldersize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
walkdir    = "2"
chrono     = "0.4"
rusqlite   = { version = "0.32", features = ["bundled"] }
trash      = "3"

[profile.release]
incremental   = true
codegen-units = 16
